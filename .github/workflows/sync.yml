name: Daily NFL Sync

on:
  schedule:
    - cron: '0 10 * * *' # 6 AM ET daily — odds refresh + missed-pick assignments
    - cron: '0 16 * * *' # 12 PM ET daily — safety net for assignments before kickoffs
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sync-data.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
